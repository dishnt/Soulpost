<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <div class="login-page-wrapper">
        <div class="auth-container">
            <div id="login-form">
                <h2>Login</h2>
                <form onsubmit="return false;"> <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Enter password" required>
                    </div>
                    <button type="button" class="auth-btn" onclick="loginUser()">Login</button>
                </form>
                <p class="toggle-text">Don't have an account? <a href="#" onclick="toggleAuth()">Create one</a></p>
            </div>

            <div id="signup-form" style="display: none;">
                <h2>Create Account</h2>
                <form onsubmit="return false;">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" placeholder="email@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" id="signup-password" placeholder="Min. 6 characters" required>
                    </div>
                    <button type="button" class="auth-btn" onclick="signUpUser()">Sign Up</button>
                </form>
                <p class="toggle-text">Already have an account? <a href="#" onclick="toggleAuth()">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // 1. Toggle between Login and Signup
        function toggleAuth() {
            const login = document.getElementById('login-form');
            const signup = document.getElementById('signup-form');
            if (login.style.display === "none") {
                login.style.display = "block";
                signup.style.display = "none";
            } else {
                login.style.display = "none";
                signup.style.display = "block";
            }
        }

        // 2. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDEiDWFc9fLTcauUbVzT1WMUKxI0un02S4",
            authDomain: "soulpost-2dfbc.firebaseapp.com",
            projectId: "soulpost-2dfbc",
            storageBucket: "soulpost-2dfbc.firebasestorage.app",
            messagingSenderId: "268413459806",
            appId: "1:268413459806:web:63f524ec66e7b1036d83cf",
            measurementId: "G-8JK4GBB3SZ"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 3. Sign Up Function
        function signUpUser() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Account Created Successfully!");
                    window.location.href = "index.html"; 
                })
                .catch((error) => {
                    alert("Sign Up Error: " + error.message);
                });
        }

        // 4. Login Function
        function loginUser() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Logged in!");
                    window.location.href = "index.html"; 
                })
                .catch((error) => {
                    alert("Login Error: " + error.message);
                });
        }
    </script>
</body>
</html>
